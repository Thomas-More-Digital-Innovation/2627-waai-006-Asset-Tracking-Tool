services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: https://github.com/Thomas-More-Digital-Innovation/2627-waai-006-Asset-Tracking-Tool.git#${GIT_REF:-main}:code/backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      UPLOAD_DIR: /app/uploads
      TZ: Europe/Amsterdam
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - db

  frontend:
    build:
      context: https://github.com/Thomas-More-Digital-Innovation/2627-waai-006-Asset-Tracking-Tool.git#${GIT_REF:-main}:code/frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data: