server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        client_max_body_size 10m;
    }

    # A backup holds every photo, so it may be much larger than a single upload
    location = /api/backup {
        proxy_pass http://backend:8000;
        client_max_body_size 1g;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
